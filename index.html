<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i-versor</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      color: #eee;
      font-family: Arial, sans-serif;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
      display: block;
    }

    #ui {
      position: fixed;
      z-index: 10;
      left: 12px;
      top: 12px;
      right: 12px;
      max-width: 620px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0,0,0,.68);
      font-size: 14px;
      line-height: 1.4;
    }

    #ui input[type="range"] {
      width: 100%;
      margin-top: 8px;
    }

    #buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    button {
      padding: 7px 11px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }

    #info {
      margin-top: 8px;
      font-family: monospace;
      white-space: normal;
    }

    #note {
      margin-top: 6px;
      opacity: .75;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div><b>f(x) = x² + i sin(x)</b></div>
    <div>Γ(x) = (x, x², sin(x))</div>
    <div>i = imaginary unit; k = geometric unit vector of the third axis; sin(x) = real coefficient along ±k</div>

    <input id="xpos" type="range" min="-12.566370614" max="12.566370614" step="0.01" value="1">
    <div id="info"></div>
    <div id="note">x interval: [-4π, 4π]. Display scaling: y = x² × 0.1, k-direction = sin(x) × 3.</div>

    <div id="buttons">
      <button id="zin" type="button">Zoom +</button>
      <button id="zout" type="button">Zoom −</button>
      <button id="reset" type="button">Reset</button>
    </div>
  </div>

  <canvas id="viewer"></canvas>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.179.1/+esm';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js/+esm';

    const canvas = document.getElementById('viewer');
    const slider = document.getElementById('xpos');
    const info = document.getElementById('info');

    const XMIN = -4 * Math.PI;
    const XMAX =  4 * Math.PI;
    const Y_SCALE = 0.1;
    const I_SCALE = 3;
    const STEPS = 3000;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x111111);

    const camera = new THREE.PerspectiveCamera(50, 1, 0.1, 500);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enablePan = false;
    controls.enableDamping = true;
    controls.dampingFactor = 0.07;
    controls.minDistance = 8;
    controls.maxDistance = 120;

    scene.add(new THREE.AmbientLight(0xffffff, 2));

    const light = new THREE.DirectionalLight(0xffffff, 2);
    light.position.set(10, 15, 15);
    scene.add(light);

    const ymax = XMAX * XMAX * Y_SCALE + 2;

    // Real plane z = 0
    const plane = new THREE.Mesh(
      new THREE.PlaneGeometry(28, ymax + 2),
      new THREE.MeshBasicMaterial({
        color: 0x888888,
        transparent: true,
        opacity: 0.08,
        side: THREE.DoubleSide,
        depthWrite: false
      })
    );
    plane.position.set(0, ymax / 2 - 1, 0);
    scene.add(plane);

    const gridPts = [];
    for (let x = -14; x <= 14; x += 2) {
      gridPts.push(new THREE.Vector3(x, 0, 0), new THREE.Vector3(x, ymax, 0));
    }
    for (let y = 0; y <= ymax; y += 2) {
      gridPts.push(new THREE.Vector3(-14, y, 0), new THREE.Vector3(14, y, 0));
    }

    scene.add(new THREE.LineSegments(
      new THREE.BufferGeometry().setFromPoints(gridPts),
      new THREE.LineBasicMaterial({ color: 0x777777, transparent: true, opacity: 0.3 })
    ));

    function line(a, b, color, opacity = 1) {
      const obj = new THREE.Line(
        new THREE.BufferGeometry().setFromPoints([a, b]),
        new THREE.LineBasicMaterial({ color, transparent: opacity < 1, opacity })
      );
      scene.add(obj);
      return obj;
    }

    // Axes: x, real component y, geometric k direction
    line(new THREE.Vector3(-14, 0, 0), new THREE.Vector3(14, 0, 0), 0xcc5555);
    line(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, ymax, 0), 0x55aa66);
    line(new THREE.Vector3(0, 0, -4), new THREE.Vector3(0, 0, 4), 0x5577dd);

    // Real base curve: G_R(x) = (x, x², 0)
    const basePts = [];

    // Full curve: Γ(x) = (x, x², sin x)
    const complexPts = [];

    for (let n = 0; n <= STEPS; n++) {
      const x = XMIN + (XMAX - XMIN) * n / STEPS;
      const y = x * x * Y_SCALE;
      const z = Math.sin(x) * I_SCALE;

      basePts.push(new THREE.Vector3(x, y, 0));
      complexPts.push(new THREE.Vector3(x, y, z));
    }

    const baseCurve = new THREE.CatmullRomCurve3(basePts);
    scene.add(new THREE.Mesh(
      new THREE.TubeGeometry(baseCurve, STEPS, 0.035, 8, false),
      new THREE.MeshStandardMaterial({ color: 0x888888, transparent: true, opacity: 0.65 })
    ));

    const complexCurve = new THREE.CatmullRomCurve3(complexPts);
    scene.add(new THREE.Mesh(
      new THREE.TubeGeometry(complexCurve, STEPS, 0.075, 12, false),
      new THREE.MeshStandardMaterial({ color: 0x2f80ed })
    ));

    // Reference segments every π
    for (let k = -4; k <= 4; k++) {
      const x = k * Math.PI;
      const y = x * x * Y_SCALE;
      const z = Math.sin(x) * I_SCALE;
      line(
        new THREE.Vector3(x, y, 0),
        new THREE.Vector3(x, y, z),
        0x777777,
        0.4
      );
    }

    const sphereGeo = new THREE.SphereGeometry(0.14, 20, 20);

    const baseMarker = new THREE.Mesh(
      sphereGeo,
      new THREE.MeshStandardMaterial({ color: 0xdd8844 })
    );
    scene.add(baseMarker);

    const complexMarker = new THREE.Mesh(
      sphereGeo,
      new THREE.MeshStandardMaterial({ color: 0x2f80ed })
    );
    scene.add(complexMarker);

    let dynamicLine = line(
      new THREE.Vector3(0, 0, 0),
      new THREE.Vector3(0, 0, 0),
      0x5577dd
    );

    function updatePoint() {
      const x = Number(slider.value);
      const yReal = x * x;
      const s = Math.sin(x);
      const y = yReal * Y_SCALE;
      const z = s * I_SCALE;

      baseMarker.position.set(x, y, 0);
      complexMarker.position.set(x, y, z);

      dynamicLine.geometry.dispose();
      dynamicLine.geometry = new THREE.BufferGeometry().setFromPoints([
        new THREE.Vector3(x, y, 0),
        new THREE.Vector3(x, y, z)
      ]);

      const direction = s > 0 ? '+k' : s < 0 ? '-k' : 'real plane';
      const modulus = Math.sqrt(yReal * yReal + s * s);
      const phase = Math.atan2(s, yReal);

      info.textContent =
        `x=${x.toFixed(2)} | x²=${yReal.toFixed(3)} | sin(x)=${s.toFixed(3)} | ` +
        `k-direction=${direction} | |sin(x)|=${Math.abs(s).toFixed(3)} | ` +
        `|f(x)|=${modulus.toFixed(3)} | arg=${phase.toFixed(3)} rad`;
    }

    slider.addEventListener('input', updatePoint);

    function fitCamera() {
      const box = new THREE.Box3().setFromObject(scene);
      const sphere = new THREE.Sphere();
      box.getBoundingSphere(sphere);

      const w = Math.max(window.innerWidth, 1);
      const h = Math.max(window.innerHeight, 1);
      camera.aspect = w / h;

      const vfov = THREE.MathUtils.degToRad(camera.fov);
      const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
      const limitingFov = Math.min(vfov, hfov);
      const distance = (sphere.radius / Math.sin(limitingFov / 2)) * 1.2;

      const direction = new THREE.Vector3(1, 0.7, 1).normalize();
      camera.position.copy(sphere.center).add(direction.multiplyScalar(distance));
      controls.target.copy(sphere.center);

      camera.near = 0.1;
      camera.far = distance * 10;
      camera.updateProjectionMatrix();
      controls.update();
    }

    function zoom(mult) {
      const dir = camera.position.clone().sub(controls.target);
      dir.multiplyScalar(mult);
      camera.position.copy(controls.target).add(dir);
      controls.update();
    }

    document.getElementById('zin').addEventListener('click', () => zoom(0.8));
    document.getElementById('zout').addEventListener('click', () => zoom(1.25));
    document.getElementById('reset').addEventListener('click', fitCamera);

    function resize() {
      const w = Math.max(window.innerWidth, 1);
      const h = Math.max(window.innerHeight, 1);
      renderer.setSize(w, h, false);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
    }

    window.addEventListener('resize', () => {
      resize();
      fitCamera();
    });

    resize();
    updatePoint();
    fitCamera();

    function animate() {
      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();
  </script>
</body>
</html>
